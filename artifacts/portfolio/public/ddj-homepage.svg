<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" font-family="'Inter','Helvetica Neue',Arial,sans-serif">
  <!-- Background -->
  <rect width="1200" height="750" fill="#FAFAFA"/>

  <!-- Top nav bar -->
  <rect width="1200" height="56" fill="#FFFFFF"/>
  <line x1="0" y1="56" x2="1200" y2="56" stroke="#E5E5E5" stroke-width="1"/>

  <!-- Logo -->
  <text x="40" y="35" font-size="16" font-weight="800" fill="#0A0A0A" letter-spacing="-0.5">Design &amp; Dev Journal</text>

  <!-- Nav links -->
  <text x="300" y="35" font-size="13" fill="#555" font-weight="500">Articles</text>
  <text x="380" y="35" font-size="13" fill="#555" font-weight="500">Tutorials</text>
  <text x="465" y="35" font-size="13" fill="#555" font-weight="500">Resources</text>
  <text x="548" y="35" font-size="13" fill="#555" font-weight="500">About</text>

  <!-- Search icon circle -->
  <circle cx="1090" cy="28" r="14" fill="#0A0A0A"/>
  <text x="1090" y="33" font-size="13" fill="#fff" text-anchor="middle">🔍</text>

  <!-- Menu button -->
  <rect x="1112" y="14" width="60" height="28" rx="14" fill="#0A0A0A"/>
  <text x="1142" y="33" font-size="12" font-weight="600" fill="#fff" text-anchor="middle">Menu</text>

  <!-- Headline section -->
  <text x="40" y="105" font-size="48" font-weight="900" fill="#0A0A0A" letter-spacing="-2">Best of the Week</text>
  <!-- "See all posts →" -->
  <text x="452" y="105" font-size="13" fill="#888" font-weight="500">See all posts →</text>

  <!-- FEATURED CARD (large left) -->
  <rect x="40" y="125" width="680" height="580" rx="18" fill="#C8E6C9"/>
  <!-- Featured image overlay gradient -->
  <defs>
    <linearGradient id="featGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="40%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.72)"/>
    </linearGradient>
  </defs>
  <rect x="40" y="125" width="680" height="580" rx="18" fill="url(#featGrad)"/>

  <!-- Date tag on featured -->
  <rect x="64" y="149" width="95" height="24" rx="12" fill="white" fill-opacity="0.85"/>
  <text x="111" y="166" font-size="11" fill="#333" text-anchor="middle" font-weight="600">Sep 06, 2025</text>

  <!-- Category pill on featured -->
  <rect x="64" y="182" width="65" height="22" rx="11" fill="#0A0A0A"/>
  <text x="97" y="197" font-size="11" fill="white" text-anchor="middle" font-weight="600">Design</text>

  <!-- Featured article title overlay -->
  <text x="64" y="570" font-size="28" font-weight="900" fill="white" letter-spacing="-0.8">Crafting editorial</text>
  <text x="64" y="604" font-size="28" font-weight="900" fill="white" letter-spacing="-0.8">layouts that breathe</text>
  <text x="64" y="638" font-size="28" font-weight="900" fill="white" letter-spacing="-0.8">and convert.</text>

  <!-- Arrow icon bottom right -->
  <circle cx="696" cy="680" r="18" fill="white" fill-opacity="0.85"/>
  <text x="696" y="686" font-size="14" text-anchor="middle" fill="#0A0A0A">↗</text>

  <!-- RIGHT COLUMN -->
  <!-- ADS / Promo card -->
  <rect x="736" y="125" width="426" height="240" rx="18" fill="#E8F5E9"/>
  <rect x="760" y="149" width="36" height="20" rx="10" fill="#0A0A0A"/>
  <text x="778" y="163" font-size="10" fill="white" text-anchor="middle" font-weight="700">ADS</text>
  <!-- Plus icon -->
  <circle cx="1138" cy="159" r="13" stroke="#0A0A0A" stroke-width="1.5" fill="none"/>
  <text x="1138" y="165" font-size="14" fill="#0A0A0A" text-anchor="middle">+</text>

  <text x="760" y="205" font-size="11" fill="#777" font-weight="500">Become A</text>
  <text x="760" y="220" font-size="11" fill="#777" font-weight="500">BROADCAST MEMBER</text>
  <text x="760" y="258" font-size="26" font-weight="900" fill="#0A0A0A" letter-spacing="-0.8">Real talk in</text>
  <text x="760" y="288" font-size="26" font-weight="900" fill="#0A0A0A" letter-spacing="-0.8">a dev world</text>
  <text x="760" y="340" font-size="12" fill="#0A0A0A" font-weight="600" text-decoration="underline">Learn more</text>

  <!-- Secondary article card -->
  <rect x="736" y="378" width="426" height="327" rx="18" fill="#D7CCC8"/>
  <!-- Small image content hint -->
  <rect x="736" y="378" width="426" height="200" rx="18" fill="#BCAAA4"/>
  <text x="949" y="478" font-size="30" text-anchor="middle" fill="white" font-weight="900">✦</text>

  <!-- See all picks link -->
  <text x="760" y="636" font-size="14" fill="#0A0A0A" font-weight="700">See all picks →</text>
</svg>
